stages:
  - test

unit-tests:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -r requirements.txt
  script:
    - pytest tests/unit_tests/ -v

e2e-test:
  stage: test
  image: python:3.12-slim
  before_script:
    - pip install -r requirements.txt
    - |
      cat > config.json <<EOF
      {
        "llm": {
          "base_url": "${LLM_BASE_URL}",
          "endpoint": "${LLM_ENDPOINT}",
          "model": "${LLM_MODEL}",
          "temperature": 0.7
        }
      }
      EOF
  script:
    - pytest tests/e2e_tests/ -v
  variables:
    INNKUBE_TOKEN: $INNKUBE_TOKEN
  only:
    - main
  when: manual
